name: ci

on:
  push:
    branches: [main, 'product/**', 'release/**', 'ops/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: testes (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Versão suportada pelo projeto (módulo nativo better-sqlite3).
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: instalação limpa
        working-directory: backend
        run: npm ci
      - name: versão do runtime
        run: node --version
      - name: suite completa (unitários + integração + backup + worker)
        working-directory: backend
        run: npm test

  e2e:
    name: e2e (Chrome headless)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: instalação limpa
        working-directory: backend
        run: npm ci
      - name: sobe web (banco temporário)
        env:
          DATABASE_PATH: tmp/e2e-saden.db
          PORT: 3100
          JWT_SECRET: ci-secret-nao-producao
        run: |
          mkdir -p tmp
          node backend/src/index.js > tmp/e2e-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3100/api/health > /dev/null; then break; fi
            sleep 1
          done
      - name: e2e do fluxo de alertas
        env:
          BASE_URL: http://127.0.0.1:3100
          DATABASE_PATH: tmp/e2e-saden.db
          # Chrome pré-instalado no runner do GitHub.
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/e2e/alerts.e2e.mjs
      - name: diagnóstico do e2e
        if: always()
        continue-on-error: true
        run: |
          echo "## diagnóstico e2e" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          (google-chrome --version 2>&1 || true) >> "$GITHUB_STEP_SUMMARY"
          (ls -l /usr/bin/google-chrome* 2>&1 || true) >> "$GITHUB_STEP_SUMMARY"
          (tail -n 20 tmp/e2e-chrome.log 2>&1 || echo "sem log do chrome") >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: log do servidor em caso de falha
        if: failure()
        run: tail -n 100 tmp/e2e-server.log

  docker:
    name: docker (web + backup + worker)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: build das imagens (via compose)
        # A imagem é construída pelo compose porque os serviços worker e backup
        # referenciam a mesma tag (`saden:1.2.2`).
        # JWT_SECRET é exigido pela interpolação do compose (valor de CI, sem uso real).
        env:
          JWT_SECRET: ci-secret-nao-producao
        run: docker compose build
      - name: valida o arquivo compose
        env:
          JWT_SECRET: ci-secret-nao-producao
        run: docker compose config --quiet
      # Os containers são criados com `docker run` (e não `compose up`) para que
      # esta etapa não dependa de interpolação/estado do compose no runner.
      # O compose em si é validado no passo anterior e no ensaio de staging.
      - name: sobe web
        run: |
          # Volume NOMEADO, não bind mount: o container roda como usuário `node`
          # (uid 1000) e não consegue escrever em diretório criado pelo runner
          # (uid 1001). Com volume nomeado o Docker herda o dono da imagem.
          docker volume create saden-ci-data
          docker run -d --name saden-web -p 3001:3001 \
            -e JWT_SECRET=ci-secret-nao-producao \
            -e NODE_ENV=production \
            -e DATABASE_PATH=data/saden.db \
            -v saden-ci-data:/app/data \
            saden:1.2.2
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/health > /dev/null; then echo "web ok"; exit 0; fi
            sleep 2
          done
          echo "web não respondeu"; docker logs saden-web; exit 1
      - name: sobe worker
        run: |
          docker run -d --name saden-worker \
            -e JWT_SECRET=ci-secret-nao-producao \
            -e NODE_ENV=production \
            -e DATABASE_PATH=data/saden.db \
            -v saden-ci-data:/app/data \
            saden:1.2.2 node backend/src/worker/index.js
      - name: health do worker
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/health/worker || true)
            if [ "$code" = "200" ]; then echo "worker saudável"; exit 0; fi
            sleep 2
          done
          echo "worker não ficou saudável"; docker logs saden-worker; exit 1
      - name: backup e restore drill na imagem
        run: |
          # Prova que backup + drill funcionam dentro da imagem publicada,
          # sobre o mesmo banco que o web e o worker estão usando.
          docker run --rm -v saden-ci-data:/app/data saden:1.2.2 sh -c '
            node backend/scripts/backup.js --db data/saden.db --out-dir /tmp/bk --retention 2 &&
            node backend/scripts/restore-drill.js --out-dir /tmp/bk &&
            node backend/scripts/backup-health.js
          '
      - name: persistência e idempotência
        run: |
          set -e
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:3001/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI","email":"ci-'$RANDOM'@saden.local","password":"123456"}' \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).token))")
          curl -fsS -X POST http://127.0.0.1:3001/api/alerts \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"series_id":"yahoo:ZS=F:brl:sc60","condition":"price_above","threshold":0.01}' > /dev/null
          docker restart saden-worker > /dev/null
          sleep 30
          N1=$(curl -fsS http://127.0.0.1:3001/api/alerts/events -H "Authorization: Bearer $TOKEN" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).events.length))")
          docker restart saden-worker > /dev/null
          sleep 30
          N2=$(curl -fsS http://127.0.0.1:3001/api/alerts/events -H "Authorization: Bearer $TOKEN" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).events.length))")
          echo "eventos: $N1 -> $N2"
          test "$N1" = "$N2"
      - name: logs e limpeza
        if: always()
        continue-on-error: true
        run: |
          docker logs saden-web || true
          docker logs saden-worker || true
          docker rm -f saden-web saden-worker || true
