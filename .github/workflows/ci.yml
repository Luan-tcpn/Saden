name: ci

on:
  push:
    branches: [main, 'product/**', 'release/**', 'ops/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: testes (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # VersÃ£o suportada pelo projeto (mÃ³dulo nativo better-sqlite3).
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: instalaÃ§Ã£o limpa
        working-directory: backend
        run: npm ci
      - name: versÃ£o do runtime
        run: node --version
      - name: suite completa (unitÃ¡rios + integraÃ§Ã£o + worker)
        working-directory: backend
        run: npm test

  e2e:
    name: e2e (Chrome headless)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: instalaÃ§Ã£o limpa
        working-directory: backend
        run: npm ci
      - name: sobe web (banco temporÃ¡rio)
        env:
          DATABASE_PATH: tmp/e2e-saden.db
          PORT: 3100
          JWT_SECRET: ci-secret-nao-producao
        run: |
          mkdir -p tmp
          node backend/src/index.js > tmp/e2e-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3100/api/health > /dev/null; then break; fi
            sleep 1
          done
      - name: e2e do fluxo de alertas
        env:
          BASE_URL: http://127.0.0.1:3100
          DATABASE_PATH: tmp/e2e-saden.db
          # Chrome prÃ©-instalado no runner do GitHub.
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/e2e/alerts.e2e.mjs
      - name: diagnÃ³stico do e2e
        if: always()
        continue-on-error: true
        run: |
          echo "## diagnÃ³stico e2e" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          (google-chrome --version 2>&1 || true) >> "$GITHUB_STEP_SUMMARY"
          (ls -l /usr/bin/google-chrome* 2>&1 || true) >> "$GITHUB_STEP_SUMMARY"
          (tail -n 20 tmp/e2e-chrome.log 2>&1 || echo "sem log do chrome") >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: log do servidor em caso de falha
        if: failure()
        run: tail -n 100 tmp/e2e-server.log

  docker:
    name: docker (web + worker)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: build das imagens (via compose)
        # A imagem Ã© construÃ­da pelo compose porque o serviÃ§o worker referencia
        # a mesma tag (`saden:1.2.1`).
        # JWT_SECRET Ã© exigido pela interpolaÃ§Ã£o do compose (valor de CI, sem uso real).
        env:
          JWT_SECRET: ci-secret-nao-producao
        run: docker compose build
      - name: valida o arquivo compose
        env:
          JWT_SECRET: ci-secret-nao-producao
        run: docker compose config --quiet
      # Os containers sÃ£o criados com `docker run` (e nÃ£o `compose up`) para que
      # esta etapa nÃ£o dependa de interpolaÃ§Ã£o/estado do compose no runner.
      # O compose em si Ã© validado no passo anterior e no ensaio de staging.
      - name: sobe web
        run: |
          # Volume NOMEADO, nÃ£o bind mount: o container roda como usuÃ¡rio `node`
          # (uid 1000) e nÃ£o consegue escrever em diretÃ³rio criado pelo runner
          # (uid 1001). Com volume nomeado o Docker herda o dono da imagem.
          docker volume create saden-ci-data
          docker run -d --name saden-web -p 3001:3001 \
            -e JWT_SECRET=ci-secret-nao-producao \
            -e NODE_ENV=production \
            -e DATABASE_PATH=data/saden.db \
            -v saden-ci-data:/app/data \
            saden:1.2.1
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/health > /dev/null; then echo "web ok"; exit 0; fi
            sleep 2
          done
          echo "web nÃ£o respondeu"; docker logs saden-web; exit 1
      - name: sobe worker
        run: |
          docker run -d --name saden-worker \
            -e JWT_SECRET=ci-secret-nao-producao \
            -e NODE_ENV=production \
            -e DATABASE_PATH=data/saden.db \
            -v saden-ci-data:/app/data \
            saden:1.2.1 node backend/src/worker/index.js
      - name: health do worker
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/health/worker || true)
            if [ "$code" = "200" ]; then echo "worker saudÃ¡vel"; exit 0; fi
            sleep 2
          done
          echo "worker nÃ£o ficou saudÃ¡vel"; docker logs saden-worker; exit 1
      - name: persistÃªncia e idempotÃªncia
        run: |
          set -e
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:3001/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI","email":"ci-'$RANDOM'@saden.local","password":"123456"}' \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).token))")
          curl -fsS -X POST http://127.0.0.1:3001/api/alerts \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"series_id":"yahoo:ZS=F:brl:sc60","condition":"price_above","threshold":0.01}' > /dev/null
          docker restart saden-worker > /dev/null
          sleep 30
          N1=$(curl -fsS http://127.0.0.1:3001/api/alerts/events -H "Authorization: Bearer $TOKEN" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).events.length))")
          docker restart saden-worker > /dev/null
          sleep 30
          N2=$(curl -fsS http://127.0.0.1:3001/api/alerts/events -H "Authorization: Bearer $TOKEN" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).events.length))")
          echo "eventos: $N1 -> $N2"
          test "$N1" = "$N2"
      - name: logs e limpeza
        if: always()
        continue-on-error: true
        run: |
          docker logs saden-web || true
          docker logs saden-worker || true
          docker rm -f saden-web saden-worker || true
